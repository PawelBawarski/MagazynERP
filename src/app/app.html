@if (httpError.messageKey(); as messageKey) {
  <div class="http-error" role="alert">
    {{ messageKey | translate }}
    <a [routerLink]="['/errors', httpError.status() ?? 500]" (click)="httpError.clear()">
      {{ 'errors.details' | translate }}
    </a>
    <button
      type="button"
      class="http-error__dismiss"
      [attr.aria-label]="'common.dismiss' | translate"
      (click)="httpError.clear()"
    >
      <svg lucideX aria-hidden="true" [size]="18" />
    </button>
  </div>
}

<router-outlet />
